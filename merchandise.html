<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ABC Fitness Studio - Merchandise</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <img src="images/Client2_LogoPalette2_D3D3D3.png" alt="ABC Logo" class="logo" />
    <nav>
      <ul>
        <li><a href="index.html">Homepage</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="merchandise.html">Merchandise</a></li>
      </ul>
    </nav>
    <div class="auth-buttons">
      <button class="signin">Sign in</button>
      <button class="register">Register</button>
    </div>
  </header>

  <main>
    <section class="merchandise">
      <h2>ABC Fitness Merchandise</h2>
      <div class="merch-grid">
        <div class="merch-item">
          <img src="images/Client2_TeeShirt.png" alt="Tee-Shirt" />
          <h3>Tee-Shirt</h3>
          <p>$19.99</p>
        </div>
        <div class="merch-item">
          <img src="images/Client2_WaterBottle.png" alt="Water Bottle" />
          <h3>Water Bottle</h3>
          <p>$14.99</p>
        </div>
        <div class="merch-item">
          <img src="images/Client2_YogaMat.png" alt="Yoga Mat" />
          <h3>Yoga Mat</h3>
          <p>$29.99</p>
        </div>
      </div>
    </section>

    <!-- Contact Info -->
    <section class="contact">
      <h2>Contact Us</h2>
      <p><strong>Email:</strong> abcfitnessstudio@fitness.com</p>
      <p><strong>Phone:</strong> (555) 123-4567</p>
      <p><strong>Address:</strong> 123 Fitness Lane, Wellness City, FL 98765</p>
    </section>
  </main>

  <!-- Footer with Subscribe -->
  <footer class="footer">
    <div class="subscribe">
      <label for="subscribe-email">Subscribe:</label>
      <input type="email" id="subscribe-email" placeholder="Enter your email" />
      <button id="subscribe-btn">Subscribe</button>
    </div>
  </footer>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
